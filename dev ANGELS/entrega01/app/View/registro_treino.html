<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../../assets/css/registro_treino.css">
    <link rel="stylesheet" href="../../assets/js/registro_treino.js">
    <link rel="stylesheet" href="../../assets/js/Treino.js">
    <link rel="icon" href="../../assets/img/Logo_Volleyball_Angels.png">
    <title>Volleyball Angels - Registro de Treino</title>
</head>
<body style="background-color: rgb(6, 5, 22);">
    <header style="display: flex; align-items: center; justify-content: center; height: 20%">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand">Volleyball Angels</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="eventos.html">Eventos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contato</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Shop</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="login.html">Login</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div style="background-color: aliceblue;" class="position-absolute top-50 start-50 translate-middle shadow-lg border p-5">
            <form id="form_treinos">
                <h1>Agenda de Treinos</h1>
                    <div class="mb-3"> <!--Tempo de duração-->
                    <label for="duracao_treino" class="form-label">Tempo de duração: </label>
                    <input type="time" class="form-control" id="duracao_treino">
                </div> 

                <div class="mb-3"> <!--Data do jogo-->
                    <label for="data_treino" class="form-label">Data do jogo: </label>
                    <input type="date" class="form-control" id="data_treino">
                </div>

                <div class="mb-3"> <!--Hora que vai começar-->
                    <label for="hora_treino" class="form-label">Horário de início: </label>
                    <input type="time" class="form-control" id="hora_treino">
                </div> 

                <div class="mb-3"> <!--Local-->
                    <label for="local_treino" class="form-label">Onde será:</label>
                    <input type="text" class="form-control" id="local_treino" placeholder="Onde será o jogo">
                </div>

                <div class="mb-3"> <!--Tipo de treino-->
                    <label class="form-label">Tipo de treino a ser feito: </label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault" id="radio1" value="Aerobico">
                        <label class="form-check-label" for="radio1">
                            Aeróbicos
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault" id="radio2" checked value="Forca">
                        <label class="form-check-label" for="radio2">
                            Força
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault" id="radio3" value="Funcional">
                        <label class="form-check-label" for="radio3">
                            Funcional
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault" id="radio4" checked value="HIIT">
                        <label class="form-check-label" for="radio4">
                            HIIT
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault" id="radio5" value="Resistencia">
                        <label class="form-check-label" for="radio5">
                            Resistência
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault" id="radio6" value="Jogo">
                        <label class="form-check-label" for="radio6">
                            Jogo rápido
                        </label>
                    </div>
                </div>

                <div class="mb-3"> <!--Nome do ADM-->
                    <label for="campoTexto" class="form-label">Nome do ADM</label>
                    <input type="text" class="form-control" id="nome_adm" placeholder="Digite seu nome aqui">
                </div>
                <button type="button" class="btn btn-primary" id="enviar_treino">Enviar</button>
            </form>
            <div id="mensagem"></div>
        </div>
    </main>
    
    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../../assets/js/registro_treino.js"></script>
</body>
</html>
