<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../../assets/css/login.css">
    <link rel="icon" href="../../assets/img/Logo_Volleyball_Angels.png">
    <title>Volleyball Angels - Login</title>
</head>

<body>
    <main>
        <div class="shadow-lg p-5 form-container">
            <div class="text-center mb-4">
                <img src="../../assets/img/ANGELS.png" class="card-img-top" alt="logo do clube Angels" style="width: 150px;">
            </div>
            <h1 class="text-center">Login</h1>
            <form>
                <div class="mb-3">
                    <label for="email-login" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email-login" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="senha-login" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha-login">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary" id="enviar">Login</button>
                    <button type="button" class="btn btn-secondary" id="entrar-cadastrar" 
                        onclick="window.location.href='../View/cadastro.html'">Cadastrar-se</button>
                </div>
            </form>
        </div>
    </main>

    <script src="../../assets/js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>
</body>
</html>
